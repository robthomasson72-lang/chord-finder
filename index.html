
<!DOCTYPE html>
<html lang="en">

  <style>
    #progressionSection {
  margin-top: 40px;
}

#progressionSection h2 {
  font-size: 22px;

.progression-subtitle {

<body>
  <main class="app">
    <header>
      <h1>🎸 Chord Finder</h1>
      <div class="subtitle">Explore the chords in any key</div>
    </header>

    <div class="selectors">
      <div class="field">
        <label for="key">KEY</label>
        <select id="key">
          <option>C</option><option>C#</option>
          <option>D</option><option>Eb</option>
          <option>E</option><option>F</option>
          <option>F#</option><option>G</option>
          <option>Ab</option><option>A</option>
          <option>Bb</option><option>B</option>
        </select>
      </div>

      <div class="field">
        <label for="scale">SCALE</label>
        <select id="scale">
          <option value="major">Major</option>

    <div class="section-title" id="sectionTitle"></div>

  <h2>Chord Progressions</h2>

  <div id="progressions"></div>

</button>

<section id="borrowedSection" hidden>

</section>
</section>

  <script>
    const chromatic = [
      "C","C#","D","D#","E","F",
      "F#","G","G#","A","A#","B"
    ];

    const roots = {
      C:0, "C#":1, D:2, Eb:3, E:4, F:5,
      "F#":6, G:7, Ab:8, A:9, Bb:10, B:11
    };

    const letterNames = ["C","D","E","F","G","A","B"];

    const majorSteps = [0,2,4,5,7,9,11];
    const minorSteps = [0,2,3,5,7,8,10];

    const majorQuality = ["","m","m","","","m","dim"];
    const minorQuality = ["m","dim","","m","m","",""];

    const majorDegrees = ["I","ii","iii","IV","V","vi","vii°"];
    const minorDegrees = ["i","ii°","III","iv","v","VI","VII"];
    const progressionLibrary = {
  major: [
    {
      name: "Classic Pop",
      degrees: "I – V – vi – IV",
      indexes: [0, 4, 5, 3]
    },
    {
      name: "Classic Rock",
      degrees: "I – IV – V – I",
      indexes: [0, 3, 4, 0]
    },
    {
      name: "Emotional / Alternative",
      degrees: "vi – IV – I – V",
      indexes: [5, 3, 0, 4]
    },
    {
      name: "50s Progression",
      degrees: "I – vi – IV – V",
      indexes: [0, 5, 3, 4]
    },
    {
      name: "Folk / Country",
      degrees: "I – IV – I – V",
      indexes: [0, 3, 0, 4]
    }
  ],

  minor: [
    {
      name: "Dark / Alternative",
      degrees: "i – VI – III – VII",
      indexes: [0, 5, 2, 6]
    },
    {
      name: "Minor Rock",
      degrees: "i – iv – VII – i",
      indexes: [0, 3, 6, 0]
    },
    {
      name: "Atmospheric",
      degrees: "i – III – VII – VI",
      indexes: [0, 2, 6, 5]
    },
    {
      name: "Minor Folk",
      degrees: "i – VII – VI – VII",
      indexes: [0, 6, 5, 6]
    },
    {
      name: "Minor Blues-Inspired",
      degrees: "i – iv – i – v",
      indexes: [0, 3, 0, 4]
    }
  ]
};

    function noteName(letter, pitch) {
      const natural = roots[letter];
      let difference = (pitch - natural + 12) % 12;

      if (difference > 6) difference -= 12;

      const accidentals = {
        "-2":"bb", "-1":"b", "0":"",
        "1":"#", "2":"##"
      };

      return letter + (accidentals[difference] ?? "?");
    }

    function getChords() {
      const key = document.getElementById("key").value;
      const mode = document.getElementById("scale").value;
      const intervals = mode === "major" ? majorSteps : minorSteps;
      const qualities = mode === "major" ? majorQuality : minorQuality;
      const degrees = mode === "major" ? majorDegrees : minorDegrees;

      const rootLetter = key[0];
      const rootLetterIndex = letterNames.indexOf(rootLetter);
      const rootPitch = roots[key];

      document.getElementById("sectionTitle").textContent =
        key + " " + (mode === "major" ? "MAJOR" : "NATURAL MINOR")
        + " · DIATONIC TRIADS";

      const container = document.getElementById("chords");
      container.replaceChildren();
      const details = document.getElementById("chordDetails");
        details.hidden = true;
        details.replaceChildren();

      for (let i = 0; i < 7; i++) {
        const letter = letterNames[(rootLetterIndex + i) % 7];
        const pitch = (rootPitch + intervals[i]) % 12;
        const chord = noteName(letter, pitch) + qualities[i];

        const card = document.createElement("div");
        card.className = "chord";
        card.setAttribute("role", "button");
card.tabIndex = 0;

function selectChord() {
  document.querySelectorAll(".chord").forEach(c => {
    c.classList.remove("selected");
  });

  card.classList.add("selected");

  const thirdStep = qualities[i] === "dim" || qualities[i] === "m" ? 3 : 4;
  const fifthStep = qualities[i] === "dim" ? 6 : 7;

  const chordNotes = [
    { pitch: pitch, label: "Root", letterOffset: 0 },
    { pitch: (pitch + thirdStep) % 12, label: thirdStep === 3 ? "Minor 3rd" : "Major 3rd", letterOffset: 2 },
    { pitch: (pitch + fifthStep) % 12, label: fifthStep === 6 ? "Diminished 5th" : "Perfect 5th", letterOffset: 4 }
  ];

  const noteHTML = chordNotes.map(n => {
    const noteLetter = letterNames[
      (rootLetterIndex + i + n.letterOffset) % 7
    ];
    return `
      <div class="note">
        ${noteName(noteLetter, n.pitch)}
        <small>${n.label}</small>
      </div>
    `;
  }).join("");

  details.innerHTML = `
    <h2>${chord}</h2>
    <div class="note-list">${noteHTML}</div>
  `;

  details.hidden = false;
  renderChordExplorer(details, { key, mode, rootLetterIndex: (rootLetterIndex + i) % 7,
    keyRootLetterIndex: rootLetterIndex, degreeIndex: i,
    rootName: noteName(letter, pitch), rootPitch: pitch, quality: qualities[i], chord });
}

card.addEventListener("click", selectChord);

card.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    selectChord();
  }
});

        const name = document.createElement("div");
        name.className = "chord-name";
        name.textContent = chord;

        const degree = document.createElement("div");
        degree.className = "degree";
        degree.textContent = degrees[i];

        card.append(name, degree);
        container.appendChild(card);
      }
      const progressionContainer =
  document.getElementById("progressions");

progressionContainer.replaceChildren();

const chordNames = [];

for (let i = 0; i < 7; i++) {
  const letter = letterNames[(rootLetterIndex + i) % 7];
  const pitch = (rootPitch + intervals[i]) % 12;

  chordNames.push(
    noteName(letter, pitch) + qualities[i]
  );
}

const selectedProgressions = progressionLibrary[mode];

selectedProgressions.forEach(progression => {
  const card = document.createElement("div");
  card.className = "progression-card";

  const heading = document.createElement("div");
  heading.className = "progression-heading";

  const name = document.createElement("div");
  name.className = "progression-name";
  name.textContent = progression.name;

  const degrees = document.createElement("div");
  degrees.className = "progression-degrees";
  degrees.textContent = progression.degrees;

  heading.append(name, degrees);

  const chordRow = document.createElement("div");
  chordRow.className = "progression-chords";

  progression.indexes.forEach(index => {
    const chord = document.createElement("div");
    chord.className = "progression-chord";
    chord.textContent = chordNames[index];

    chordRow.appendChild(chord);
  });

  card.append(heading, chordRow);
  progressionContainer.appendChild(card);
});
    }

    document.getElementById("key").addEventListener("change", getChords);
    document.getElementById("scale").addEventListener("change", getChords);
    getChords();
    const borrowedButton = document.getElementById("borrowedButton");
const borrowedSection = document.getElementById("borrowedSection");

const borrowedLibrary = {
  major: [
    { degree: "iv", offset: 5, quality: "m",
      description: "Melancholic / bittersweet" },
    { degree: "bVI", offset: 8, quality: "",
      description: "Cinematic / dramatic" },
    { degree: "bVII", offset: 10, quality: "",
      description: "Rock / modal" },
    { degree: "bIII", offset: 3, quality: "",
      description: "Unexpected / colourful" }
  ],
  minor: [
    { degree: "IV", offset: 5, quality: "",
      description: "Bright / uplifting" },
    { degree: "I", offset: 0, quality: "",
      description: "Strong / resolved" },
    { degree: "ii", offset: 2, quality: "m",
      description: "Gentle / hopeful" }
  ]
};
const borrowedExamples = {
  major: [
    {
      progression: ["I", "V", "iv", "I"],
      borrowedPositions: [2],
      explanation: "The minor iv adds a bittersweet colour before returning home."
    },
    {
      progression: ["I", "bVI", "bVII", "I"],
      borrowedPositions: [1, 2],
      explanation: "The flat VI and flat VII create a dramatic, cinematic movement."
    },
    {
      progression: ["I", "IV", "bVII", "I"],
      borrowedPositions: [2],
      explanation: "The flat VII gives this progression a classic rock flavour."
    },
    {
      progression: ["I", "bIII", "IV", "I"],
      borrowedPositions: [1],
      explanation: "The flat III introduces an unexpected shift in colour."
    }
  ],

  minor: [
    {
      progression: ["i", "VI", "IV", "i"],
      borrowedPositions: [2],
      explanation: "The major IV introduces a brighter, Dorian-like sound."
    },
    {
      progression: ["i", "iv", "V", "I"],
      borrowedPositions: [2, 3],
      explanation: "The major tonic creates a brighter final resolution."
    },
    {
      progression: ["i", "ii", "VII", "i"],
      borrowedPositions: [1],
      explanation: "The minor ii adds a brighter, Dorian-like colour."
    }
  ]
};


const flatNames = [
  "C","Db","D","Eb","E","F",
  "Gb","G","Ab","A","Bb","B"
];

function getBorrowedChords() {
  const key = document.getElementById("key").value;
  const mode = document.getElementById("scale").value;
  const rootPitch = roots[key];

  const container = document.getElementById("borrowedChords");
  container.replaceChildren();

  borrowedLibrary[mode].forEach(item => {
    const pitch = (rootPitch + item.offset) % 12;

    const preferFlats = ["F","Bb","Eb","Ab","D","G","C"].includes(key);
    const names = preferFlats ? flatNames : chromatic;

    const chord = names[pitch] + item.quality;

    const third = (pitch + (item.quality === "m" ? 3 : 4)) % 12;
    const fifth = (pitch + 7) % 12;

    const card = document.createElement("div");
    card.className = "borrowed-card";

    const title = document.createElement("div");
    title.className = "borrowed-name";
    title.textContent = chord + "  (" + item.degree + ")";

    const description = document.createElement("div");
    description.className = "borrowed-description";
    description.textContent = item.description;

    const notes = document.createElement("div");
    notes.className = "borrowed-notes";
    notes.textContent =
      "Notes: " +
      [pitch, third, fifth].map(p => names[p]).join(" – ");

    card.append(title, description, notes);

// Find the matching example progression
const itemIndex = borrowedLibrary[mode].indexOf(item);
const example = borrowedExamples[mode][itemIndex];

// Build the progression section
const exampleSection = document.createElement("div");
exampleSection.className = "borrowed-example";

const exampleTitle = document.createElement("div");
exampleTitle.className = "borrowed-example-title";
exampleTitle.textContent = "TRY THIS PROGRESSION";

const progressionRow = document.createElement("div");
progressionRow.className = "borrowed-progression";


const borrowedPitch = (rootPitch + item.offset) % 12;
const borrowedName = chord;

// Build a lookup of chords in the selected key
const intervals = mode === "major" ? majorSteps : minorSteps;
const qualities = mode === "major" ? majorQuality : minorQuality;
const degrees = mode === "major" ? majorDegrees : minorDegrees;
const rootLetterIndex = letterNames.indexOf(key[0]);

const chordLookup = {};

for (let i = 0; i < 7; i++) {
  const letter = letterNames[(rootLetterIndex + i) % 7];
  const pitch = (rootPitch + intervals[i]) % 12;

  chordLookup[degrees[i]] =
    noteName(letter, pitch) + qualities[i];
}

// Add the borrowed chords from the parallel key
const parallelIntervals = mode === "major" ? minorSteps : majorSteps;
const parallelQualities = mode === "major" ? minorQuality : majorQuality;
const parallelDegrees = mode === "major" ? minorDegrees : majorDegrees;

for (let i = 0; i < 7; i++) {
  const letter = letterNames[(rootLetterIndex + i) % 7];
  const pitch = (rootPitch + parallelIntervals[i]) % 12;

  const degree = parallelDegrees[i];

  // Convert parallel-key degrees to our borrowed-chord labels
  const borrowedDegree = mode === "major"
    ? { "III": "bIII", "VI": "bVI", "VII": "bVII" }[degree] || degree
    : degree;

  chordLookup[borrowedDegree] =
    noteName(letter, pitch) + parallelQualities[i];
}

// Render the progression and highlight its borrowed chords
example.progression.forEach((degree, position) => {
  const box = document.createElement("div");
  box.className = "borrowed-progression-chord";

  box.textContent = chordLookup[degree] || "?";

  if (example.borrowedPositions.includes(position)) {
    box.classList.add("highlight");
  }

  progressionRow.appendChild(box);
});

const explanation = document.createElement("div");
explanation.className = "borrowed-explanation";
explanation.textContent = example.explanation;

exampleSection.append(
  exampleTitle,
  progressionRow,
  explanation
);

card.appendChild(exampleSection);
container.appendChild(card);
  });
}

borrowedButton.addEventListener("click", () => {
  const isHidden = borrowedSection.hidden;

  borrowedSection.hidden = !isHidden;

  borrowedButton.textContent = isHidden
    ? "Hide Borrowed Chords"
    : "Explore Borrowed Chords";

  if (isHidden) getBorrowedChords();
});

document.getElementById("key").addEventListener("change", () => {
  if (!borrowedSection.hidden) getBorrowedChords();
});

document.getElementById("scale").addEventListener("change", () => {
  if (!borrowedSection.hidden) getBorrowedChords();
});

// Version 1.8: spell notes by their letter and pitch, including extensions.
function spelledNote(letterIndex, pitch) {
  return noteName(letterNames[(letterIndex + 7) % 7], (pitch + 12) % 12);
}
function chordNotesFor(rootLetterIndex, rootPitch, offsets) {
  return offsets.map(([letterOffset, semitones]) =>
    spelledNote(rootLetterIndex + letterOffset, rootPitch + semitones));
}
function extensionChoices(info) {
  const { rootLetterIndex, rootPitch, quality, rootName } = info;
  const minor = quality === 'm';
  const diminished = quality === 'dim';
  const entries = [];
  const add = (suffix, offsets, description) => entries.push({
    name: rootName + suffix,
    notes: chordNotesFor(rootLetterIndex, rootPitch, offsets), description
  });
  if (diminished) {
    add('m7b5', [[0,0],[2,3],[4,6],[6,10]], 'Half-diminished seventh; tense and unresolved.');
    add('dim7', [[0,0],[2,3],[4,6],[6,9]], 'Fully diminished seventh; symmetrical and dramatic.');
    return entries;
  }
  const third = minor ? 3 : 4;
  const triad = [[0,0],[2,third],[4,7]];
  if (minor) {
    add('m7', [...triad,[6,10]], 'Warm minor seventh; softens the minor triad.');
    add('m(maj7)', [...triad,[6,11]], 'Minor-major seventh; haunting and tense.');
    add('m9', [...triad,[6,10],[1,14]], 'Minor ninth; spacious and atmospheric.');
    add('madd9', [...triad,[1,14]], 'Minor triad with an added ninth, without a seventh.');
  } else {
    add('maj7', [...triad,[6,11]], 'Major seventh; lush and reflective.');
    add('7', [...triad,[6,10]], 'Dominant seventh; adds tension that often leads to another chord.');
    add('9', [...triad,[6,10],[1,14]], 'Dominant ninth; colourful and bluesy.');
    add('add9', [...triad,[1,14]], 'Major triad with an added ninth, without a seventh.');
  }
  add('sus2', [[0,0],[1,2],[4,7]], 'Suspended second; replaces the third with the second.');
  add('sus4', [[0,0],[3,5],[4,7]], 'Suspended fourth; replaces the third with the fourth.');
  return entries;
}
function substitutionsFor(info) {
  const { key, mode, rootPitch, keyRootLetterIndex, degreeIndex, quality, chord } = info;
  const scaleSteps = mode === 'major' ? majorSteps : minorSteps;
  const scaleQualities = mode === 'major' ? majorQuality : minorQuality;
  const scaleDegrees = mode === 'major' ? majorDegrees : minorDegrees;
  const items = [];
  function diatonic(index) {
    const p = (roots[key] + scaleSteps[index]) % 12;
    return noteName(letterNames[(keyRootLetterIndex + index) % 7], p) + scaleQualities[index];
  }
  // Relative-function alternatives share two or more chord tones, but are not always interchangeable.
  if (quality !== 'dim') {
    const candidates = [0,1,2,3,4,5].filter(i => i !== degreeIndex);
    const pitchSet = new Set([0, quality === 'm' ? 3 : 4, 7].map(x => (rootPitch+x)%12));
    const scored = candidates.map(i => {
      const r = (roots[key] + scaleSteps[i]) % 12;
      const third = scaleQualities[i] === 'm' ? 3 : 4;
      const notes = [r,(r+third)%12,(r+7)%12];
      return {i,shared:notes.filter(n => pitchSet.has(n)).length};
    }).filter(x=>x.shared>=2).sort((a,b)=>b.shared-a.shared).slice(0,2);
    scored.forEach(({i,shared})=>items.push({
      name:diatonic(i), type:'Shared-tone alternative',
      text:`Shares ${shared} notes with ${chord}. Try it for a change in bass movement or harmonic colour; the function may change.`
    }));
  }
  // Borrowed minor iv in major keys; relative to the fourth scale degree.
  if (mode === 'major' && degreeIndex === 3) {
    const fourthLetter = (keyRootLetterIndex + 3) % 7;
    const fourthPitch = (roots[key] + 5) % 12;
    items.unshift({name:spelledNote(fourthLetter, fourthPitch)+'m', type:'Borrowed iv',
      text:'Borrowed from the parallel minor. A bittersweet alternative to the major IV.'});
  }
  // Secondary dominant of the dominant: II7 -> V (not a same-function substitution).
  if (mode === 'major' && degreeIndex === 1) {
    const secondLetter = (keyRootLetterIndex + 1) % 7;
    const secondPitch = (roots[key] + 2) % 12;
    items.push({name:spelledNote(secondLetter,secondPitch)+'7',type:'Secondary dominant (V7/V)',
      text:'Try this in place of ii when moving to V. It introduces an outside note and stronger forward motion.'});
  }
  // Picardy third in natural minor.
  if (mode === 'minor' && degreeIndex === 0) {
    items.push({name:info.rootName,type:'Major tonic (Picardy third)',
      text:'Use the major tonic at a final cadence for a brighter resolution; it is not a direct substitute throughout the song.'});
  }
  return items;
}
function renderChordExplorer(details, info) {
  const actions = document.createElement('div');
  actions.className = 'explorer-actions';
  const panel = document.createElement('section');
  panel.className = 'explorer-panel';
  panel.hidden = true;
  const modes = [
    ['extensions','Explore Extensions'],
    ['substitutions','Explore Substitutions']
  ];
  const buttons = [];
  function show(which) {
    const active = buttons.find(b=>b.dataset.mode===which);
    const wasOpen = active.getAttribute('aria-pressed') === 'true';
    buttons.forEach(b=>b.setAttribute('aria-pressed','false'));
    if (wasOpen) { panel.hidden=true; panel.replaceChildren(); return; }
    active.setAttribute('aria-pressed','true');
    panel.hidden=false;
    panel.replaceChildren();
    const heading = document.createElement('h3');
    heading.textContent = which==='extensions' ? 'Chord extensions & variations' : 'Substitutions & reharmonizations';
    const hint = document.createElement('p');
    hint.className='explorer-hint';
    hint.textContent = which==='extensions'
      ? 'These are alternative voicings or chord types built on the same root. Suspended chords replace the third.'
      : 'These are creative alternatives, not guaranteed one-for-one replacements. Play them in context to hear what changes.';
    const grid = document.createElement('div');
    grid.className='explorer-grid';
    const choices = which==='extensions' ? extensionChoices(info) : substitutionsFor(info);
    choices.forEach(choice=>{
      const card=document.createElement('div'); card.className='explorer-card';
      const name=document.createElement('strong'); name.textContent=choice.name;
      card.appendChild(name);
      const detail=document.createElement('small');
      detail.textContent=which==='extensions' ? choice.notes.join(' · ') : choice.type;
      card.appendChild(detail);
      const description=document.createElement('p'); description.textContent=choice.description || choice.text;
      card.appendChild(description); grid.appendChild(card);
    });
    if (!choices.length) {
      const msg=document.createElement('p'); msg.className='explorer-hint';
      msg.textContent='No curated substitutions for this chord yet. Try its extensions instead.';
      grid.appendChild(msg);
    }
    panel.append(heading,hint,grid);
  }
  modes.forEach(([mode,label])=>{
    const button=document.createElement('button'); button.type='button';
    button.className='explorer-button'; button.dataset.mode=mode;
    button.textContent=label; button.setAttribute('aria-pressed','false');
    button.addEventListener('click',()=>show(mode));
    actions.appendChild(button); buttons.push(button);
  });
  details.append(actions,panel);
}
